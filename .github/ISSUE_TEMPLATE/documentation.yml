name: 문서 개선
description: 이해하기 어렵거나 빠진 설명을 제안한다.
title: "docs: "
labels:
  - "type:docs"
body:
  - type: input
    id: document
    attributes:
      label: 대상 문서 또는 코드
      placeholder: "docs/modules/rendering.md 또는 RenderScene::sync"
    validations:
      required: true
  - type: textarea
    id: confusion
    attributes:
      label: 막힌 지점
      description: 어떤 배경지식이 없어서 이해하기 어려웠는지 적어 줘.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 원하는 설명
      description: 예제, 그림, 용어 설명 등 도움이 될 형태를 적어 줘.
