name: 기능 제안
description: 새 엔진 기능이나 학습 목표를 제안한다.
title: "feat: "
labels:
  - "type:feature"
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자가 무엇을 할 수 있게 되는지 적어 줘.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
      description: 지금 구조에서 어떤 문제나 학습 필요를 해결하는지 적어 줘.
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: 예상 코드 흐름
      description: 관련될 World, Actor, Component, System을 적어 줘.
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 테스트와 화면에서 확인할 결과를 체크리스트로 적어 줘.
    validations:
      required: true
